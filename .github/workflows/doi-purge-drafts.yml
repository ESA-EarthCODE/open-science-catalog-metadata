name: DOI Purge Drafts

on:
  workflow_dispatch:

jobs:
  purge:
    name: Purge All DataCite Drafts
    runs-on: ubuntu-latest
    if: github.repository_owner == 'ESA-EarthCODE' || github.repository_owner == 'esa-earthcode'
    steps:
      - name: Checkout
        uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Purge Drafts from DataCite
        env:
          DATACITE_API_URL: ${{ secrets.DATACITE_API_URL || 'https://api.test.datacite.org' }}
          DATACITE_USER: ${{ secrets.DATACITE_USER }}
          DATACITE_PASSWORD: ${{ secrets.DATACITE_PASSWORD }}
          DATACITE_PREFIX: ${{ secrets.DATACITE_PREFIX }}
        run: python3 .github/scripts/doi/cleanup_all_drafts.py
